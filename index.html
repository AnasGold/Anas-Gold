<!DOCTYPE html>
<html lang="ku">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anas Gold</title>
  <style>
    body{
      font-family:Arial,sans-serif;
      background:#f5f5f5;
      text-align:center;
      margin:0;
      padding:20px;
    }
    h1{
      color:#c89b00;
    }
    .card{
      background:#fff;
      margin:15px auto;
      padding:20px;
      max-width:350px;
      border-radius:12px;
      box-shadow:0 2px 10px rgba(0,0,0,.2);
    }
    button{
      width:100%;
      padding:12px;
      margin:8px 0;
      border:none;
      border-radius:8px;
      font-size:18px;
      cursor:pointer;
    }
    .gold{background:#FFD700;}
    .silver{background:#C0C0C0;}
    .copper{background:#B87333;color:white;}
  </style>
</head>
<body>

<h1>Anas Gold</h1>

<div class="card">
<h2>Gold</h2>
<button onclick="alert('هاتووی Gold')">هاتوو</button>
<button onclick="alert('دەرچووی Gold')">دەرچوو</button>
</div>

<div class="card">
<h2>Silver</h2>
<button onclick="alert('هاتووی Silver')">هاتوو</button>
<button onclick="alert('دەرچووی Silver')">دەرچوو</button>
</div>

<div class="card">
<h2>مس</h2>
<button onclick="alert('هاتووی مس')">هاتوو</button>
<button onclick="alert('دەرچووی مس')">دەرچوو</button>
</div>

</body>
</html>
