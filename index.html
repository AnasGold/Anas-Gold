<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anas Gold - سیستەمی بەڕێوەبردن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Noto Sans Arabic', sans-serif; background-color: #0b0f19; color: #f8fafc; }
        .gold-gradient { background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728); }
        .glass-card { background: rgba(20, 27, 45, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Auth Screen -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl z-[100] flex items-center justify-center p-4">
        <div class="glass-card max-w-sm w-full p-8 rounded-3xl border border-slate-800">
            <h2 class="text-2xl font-black text-center text-yellow-500 mb-6">Anas Gold</h2>
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <input type="email" id="auth-email" required placeholder="ئیمەیڵ" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white">
                <input type="password" id="auth-password" required placeholder="پاسۆرد" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white">
                <button type="submit" class="w-full gold-gradient text-slate-950 font-bold py-3 rounded-xl">چوونەژوورەوە</button>
            </form>
        </div>
    </div>

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-40 backdrop-blur-lg">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-2">
                    <div class="w-9 h-9 rounded-xl gold-gradient flex items-center justify-center text-slate-950 font-bold">A</div>
                    <div>
                        <h1 class="text-lg font-black text-white leading-tight" id="user-name-display">بەکارهێنەر</h1>
                        <p class="text-[9px] text-slate-500">سیستەمی بەڕێوەبردن</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="openProfileModal()" class="w-9 h-9 bg-slate-900 border border-slate-800 rounded-xl text-yellow-500"><i class="fa-solid fa-user-edit"></i></button>
                    <button onclick="handleLogout()" class="w-9 h-9 bg-slate-900 border border-slate-800 rounded-xl text-rose-400"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>
            
            <!-- Tabs -->
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1" id="tab-container">
                <button onclick="switchTab('gold')" id="tab-gold" class="px-4 py-2 rounded-xl font-bold text-xs bg-yellow-500 text-slate-950 whitespace-nowrap">ئاڵتون</button>
                <button onclick="switchTab('silver_palm')" id="tab-silver_palm" class="px-4 py-2 rounded-xl font-bold text-xs bg-slate-900 text-slate-400 whitespace-nowrap">زیوی پاڵم</button>
                <button onclick="switchTab('silver_marmar')" id="tab-silver_marmar" class="px-4 py-2 rounded-xl font-bold text-xs bg-slate-900 text-slate-400 whitespace-nowrap">زیوی مەڕمەڕ</button>
                <button onclick="switchTab('gold_coin')" id="tab-gold_coin" class="px-4 py-2 rounded-xl font-bold text-xs bg-slate-900 text-slate-400 whitespace-nowrap">لیرە</button>
            </div>
        </div>
    </header>

    <!-- Profile Modal -->
    <div id="profile-modal" class="hidden fixed inset-0 bg-black/80 z-[110] flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-sm p-6 rounded-2xl">
            <h3 class="text-lg font-bold text-white mb-4">دەستکاریکردنی پڕۆفایل</h3>
            <input type="text" id="new-display-name" placeholder="ناوی خۆت بنووسە" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white mb-4">
            <div class="flex gap-2">
                <button onclick="saveProfile()" class="flex-1 bg-yellow-500 text-black font-bold py-2 rounded-xl">پاشەکەوتکردن</button>
                <button onclick="closeProfileModal()" class="flex-1 bg-slate-800 text-white py-2 rounded-xl">داخستن</button>
            </div>
        </div>
    </div>

    <!-- Main Content (Same as before but cleaner) -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div id="transaction-table-body"></div>
    </main>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDWaA1WE2hL4lCTsu4EHQRg1_rGcFKny-M", authDomain: "anas-gold.firebaseapp.com", projectId: "anas-gold", storageBucket: "anas-gold.firebasestorage.app", messagingSenderId: "134721629273", appId: "1:134721629273:web:4058c0d4eaf236bdbe5548" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Profile Logic
        window.openProfileModal = () => document.getElementById('profile-modal').classList.remove('hidden');
        window.closeProfileModal = () => document.getElementById('profile-modal').classList.add('hidden');
        
        window.saveProfile = async () => {
            const newName = document.getElementById('new-display-name').value;
            if(newName && auth.currentUser) {
                await updateProfile(auth.currentUser, { displayName: newName });
                document.getElementById('user-name-display').innerText = newName;
                closeProfileModal();
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('user-name-display').innerText = user.displayName || "بەکارهێنەر";
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        });

        window.handleLogout = () => signOut(auth);
        window.handleAuth = async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            try { await signInWithEmailAndPassword(auth, email, password); } 
            catch (err) { alert("هەڵە: " + err.message); }
        };
    </script>
</body>
</html>
